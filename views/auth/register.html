<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" sizes="300x300" href="/assets/favicon/favicon.ico">
    <title>إنشاء حساب – Rate Me</title>

    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/common/ui.css">
</head>

<body class="login-container register-page">

    <div class="auth-header">

        <a href="https://rateme.ly/" class="logo">
            <img src="https://storage.googleapis.com/msgsndr/0IV0KhyUwqPwxd8GvQ28/media/6957dd4be7c61370dc6562a0.png"
                alt="Rate Me">
        </a>

        <h1 class="auth-title">
            Rate Me قيمني
        </h1>

        <p class="auth-subtitle">
            منصة تقييم المطاعم والعملاء
        </p>
        <p class="auth-tagline">
            اجمع تقييمات عملائك بسهولة عبر QR Code
        </p>

    </div>
    <form id="registerForm">
        <h1>إنشاء حساب مطعم</h1>

        <div class="selected-plan-box">
            <strong>الباقة المختارة:</strong>
            <span id="selectedPlanName">-</span>
        </div>
        <div class="form-group">
            <label>اسم المطعم</label>
            <input type="text" id="restaurantName" required>
        </div>

        <div class="form-group">
            <label>رقم الهاتف</label>
            <input type="tel" id="phone" required placeholder="0912345678">
        </div>

        <div class="form-group">
            <label>كلمة المرور</label>
            <input type="password" id="password" required>
        </div>

        <div class="form-group">
            <label>تأكيد كلمة المرور</label>
            <input type="password" id="confirmPassword" required>
        </div>

        <button type="submit" class="btn" id="registerBtn" style="width:100%;">
            إنشاء الحساب
        </button>

        <div class="auth-link">
            لديك حساب بالفعل؟
            <a href="/login">
                تسجيل الدخول
            </a>
        </div>
    </form>

    <div id="toast-container" class="toast-container"></div>

    <script src="/assets/locales/ar.js"></script>
    <script src="/assets/js/common/ui.js"></script>
    <script src="/assets/js/register.js"></script>
</body>

</html>
